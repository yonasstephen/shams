server {
    # Written by docker-entrypoint.sh: TLS on 443 when certificates are mounted,
    # plain HTTP on 80 otherwise. Mirrors the httpsConfig() fallback in
    # vite.config.ts so a certless run still starts.
    include /etc/nginx/listen.inc;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    # Allow self, inline styles (used by Tailwind), and inline scripts (used by Vite/React)
    # Note: connect-src allows connections to backend (http/https) and Yahoo APIs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # HSTS (HTTP Strict Transport Security) - Only enable if using HTTPS
    # Uncomment this line if your reverse proxy provides HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy the API so the browser sees a single origin.
    #
    # The backend must speak HTTPS (Yahoo requires an HTTPS OAuth redirect_uri),
    # and under Chrome's schemeful same-site an HTTP page calling an HTTPS API is
    # cross-site even on the same host. The session cookie is SameSite=Lax, so it
    # was withheld from every XHR: /api/auth/me answered 401 and the app bounced
    # back to /login forever. Serving the API from this origin makes each call
    # same-origin, so the cookie rides along with no attribute loosened.
    #
    # It also removes CORS entirely, hides the backend's certificate from the
    # browser, and lets the same deployment answer on LAN, Tailscale and
    # localhost addresses without rebuilding config.js for each one.
    #
    # proxy_ssl_verify is off because the backend presents the same self-signed
    # certificate and is only reachable on the internal compose network.
    location /api/ {
        # Resolve per request through Docker's embedded DNS. A bare hostname in
        # proxy_pass is resolved once at config load, so a backend restart with a
        # new container IP would strand nginx on a dead address until it is
        # itself restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shams_backend https://backend:8000;
        proxy_pass $shams_backend$request_uri;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Waiver and matchup projections fan out to the NBA API and can be slow.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime configuration, rewritten by docker-entrypoint.sh on every start.
    # It must not fall into the immutable asset cache below: the filename never
    # changes, so a browser that cached it would keep calling the previous
    # deployment's API URL for a year without revalidating.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Cache static assets (hashed filenames, safe to freeze)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
