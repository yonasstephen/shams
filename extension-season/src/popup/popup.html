<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shams Season Assistant</title>
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; margin: 0; padding: 14px; width: 320px; color: #1f2933; }
      h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 10px; color: #2d4373; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0 0 12px; }
      dt { color: #6b7280; }
      dd { margin: 0; text-align: right; }
      input { width: 100%; box-sizing: border-box; font: inherit; padding: 5px; border: 1px solid #d7dbe0; border-radius: 5px; }
      button { font: inherit; padding: 5px 10px; border-radius: 5px; border: 1px solid #2d4373; background: #2d4373; color: #fff; cursor: pointer; }
      button.secondary { background: #fff; color: #2d4373; }
      .row { display: flex; gap: 6px; margin-top: 8px; }
      .note { color: #6b7280; font-size: 11px; margin-top: 10px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <h1>Shams Season Assistant</h1>
    <dl>
      <dt>Feed</dt><dd id="state">…</dd>
      <dt>Season</dt><dd id="season">–</dd>
      <dt>Built</dt><dd id="generated">–</dd>
      <dt>Downloaded</dt><dd id="fetched">–</dd>
    </dl>
    <label for="base">Feed URL</label>
    <input id="base" spellcheck="false" />
    <div class="row">
      <button id="refresh">Refresh feed</button>
      <button id="save" class="secondary">Save URL</button>
    </div>
    <p class="note">
      Yahoo data is read from your own browser session on the page. Only the NBA feed is
      fetched from the network.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
