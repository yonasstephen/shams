services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${HTTP_PROXY:-}
        - https_proxy=${HTTPS_PROXY:-}
    ports:
      - "8000:8000"
    environment:
      - YAHOO_CONSUMER_KEY=${YAHOO_CONSUMER_KEY}
      - YAHOO_CONSUMER_SECRET=${YAHOO_CONSUMER_SECRET}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      # Only used to build the Yahoo OAuth redirect_uri, which must point at
      # the origin the browser talks to - that is the nginx proxy, not :8000.
      - BACKEND_URL=${BACKEND_URL:?BACKEND_URL is required (the public origin, e.g., https://yourdomain.com:5173)}
      # Same origin as BACKEND_URL now that nginx fronts both; used for the
      # post-login redirect and as the sole allowed CORS origin.
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL is required (e.g., https://yourdomain.com:5173)}
      - DEBUG=False
    volumes:
      # Share cache directory with host for persistent data
      - ~/.shams:/root/.shams # CHANGE: map to the local volume dir
      # Mount SSL certificates (required for Yahoo OAuth)
      - ./certs:/app/certs:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --ssl-keyfile=/app/certs/key.pem --ssl-certfile=/app/certs/cert.pem
    restart: unless-stopped
    # Bound memory so a leak/spike is killed and restarted cleanly instead of
    # taking down the host/VM. Tune to your host.
    mem_limit: 1g
    mem_reservation: 512m
    # Self-recovery signal: hits the existing /health endpoint (self-signed HTTPS,
    # so -k). curl is already installed in backend/Dockerfile.
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Cap container logs so long uptimes don't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shams-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - http_proxy=${HTTP_PROXY:-}
        - https_proxy=${HTTPS_PROXY:-}
    ports:
      # nginx terminates TLS and proxies /api to the backend, so this single
      # published port serves the whole app. See frontend/nginx.conf.
      - "5173:443"
    environment:
      # Relative by default: the API is proxied at /api on this same origin,
      # which keeps the session cookie same-site and lets one deployment answer
      # on LAN, Tailscale and localhost addresses without a rebuild. Set an
      # absolute URL only if the API really lives on another origin.
      - VITE_API_URL=${FRONTEND_API_URL:-/}
    volumes:
      # nginx serves HTTPS from these; without them it falls back to plain HTTP
      # and Yahoo OAuth will not work.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    # Cap container logs so long uptimes don't fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shams-network

networks:
  shams-network:
    driver: bridge

